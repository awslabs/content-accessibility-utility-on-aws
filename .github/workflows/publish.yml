name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    tags:
      - 'v*'
  # Re-run only the sign-and-release job for a tag that is already on PyPI
  # (for example after a failed "Create GitHub Release" step). The dists are
  # downloaded from PyPI and checked against PyPI's sha256 digests; nothing is
  # rebuilt or re-published.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing production tag to sign and attach to its GitHub Release (for example v1.2.0)
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build distribution 📦
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.x"
    - name: Inject RC version from tag
      if: github.ref_type == 'tag' && contains(github.ref_name, '-RC')
      run: |
        # Extract version from tag (remove 'v' prefix)
        VERSION="${GITHUB_REF_NAME#v}"
        echo "Injecting RC version: $VERSION"

        # Update __init__.py with the RC version (not committed, just for build)
        sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" \
          content_accessibility_utility_on_aws/__init__.py

        # Verify the change
        grep "__version__" content_accessibility_utility_on_aws/__init__.py
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-package-distributions
        path: dist/

  validate-tag:
    name: Validate tag format
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_production_tag: ${{ steps.check.outputs.is_production }}
      is_rc_tag: ${{ steps.check.outputs.is_rc }}
    steps:
    - name: Check tag format
      id: check
      run: |
        TAG="${GITHUB_REF_NAME}"
        echo "Validating tag: $TAG"

        # Production tag pattern: v{major}.{minor}.{patch}
        if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Tag matches production pattern (v{x.x.x})"
          echo "is_production=true" >> "$GITHUB_OUTPUT"
          echo "is_rc=false" >> "$GITHUB_OUTPUT"
        # RC tag pattern: v{major}.{minor}.{patch}-RC{number}
        elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-RC[0-9]+$ ]]; then
          echo "Tag matches RC pattern (v{x.x.x}-RC{x})"
          echo "is_production=false" >> "$GITHUB_OUTPUT"
          echo "is_rc=true" >> "$GITHUB_OUTPUT"
        else
          echo "Tag does not match any release pattern"
          echo "is_production=false" >> "$GITHUB_OUTPUT"
          echo "is_rc=false" >> "$GITHUB_OUTPUT"
        fi

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs: [build, validate-tag]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.validate-tag.outputs.is_production_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/content-accessibility-utility-on-aws
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs: [build, validate-tag]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.validate-tag.outputs.is_rc_tag == 'true'
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/content-accessibility-utility-on-aws

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/

  fetch-published-dists:
    name: Download the published dists 📦 from PyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
    - name: Download and verify against PyPI sha256 digests
      run: |
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$TAG' is not a production tag (vX.Y.Z)"
          exit 1
        fi
        mkdir -p dist
        python3 - <<'PY'
        import hashlib, json, os, sys, urllib.request

        version = os.environ["TAG"][1:]
        url = f"https://pypi.org/pypi/content-accessibility-utility-on-aws/{version}/json"
        with urllib.request.urlopen(url, timeout=30) as r:
            files = json.load(r)["urls"]
        kinds = {f["packagetype"] for f in files}
        if not {"sdist", "bdist_wheel"} <= kinds:
            sys.exit(f"PyPI has {sorted(kinds)} for {version}; expected sdist and wheel")
        for f in files:
            name = f["filename"]
            if "/" in name or name.startswith("."):
                sys.exit(f"unexpected file name {name!r}")
            with urllib.request.urlopen(f["url"], timeout=60) as r:
                data = r.read()
            digest = hashlib.sha256(data).hexdigest()
            if digest != f["digests"]["sha256"]:
                sys.exit(f"sha256 mismatch for {name}")
            with open(os.path.join("dist", name), "wb") as out:
                out.write(data)
            print(f"{digest}  {name}")
        PY
    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-package-distributions
        path: dist/

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs: [publish-to-pypi, fetch-published-dists]
    # Runs after a tag push publishes to PyPI, or after a manual dispatch
    # fetched the already-published dists.
    if: >-
      !cancelled()
      && (needs.publish-to-pypi.result == 'success'
          || needs.fetch-published-dists.result == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    env:
      # Untrusted values reach scripts only through env, never ${{ }} in run.
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    # Check out the triggering ref: the tag on a tag push, the dispatching
    # branch (main) on a manual run. Not the input tag: an older tag may
    # predate .github/scripts/extract-release-notes.sh. The dists come from
    # the artifact, so the checkout supplies only scripts and CHANGELOG.md.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Extract release notes from changelog
      # Written to a file and passed with --notes-file, so the changelog text
      # is never parsed by a shell.
      run: .github/scripts/extract-release-notes.sh "${TAG#v}" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
    - name: Create or update GitHub Release
      # Idempotent: if the release already exists (created by hand, or by an
      # earlier run), upload the dists and signatures, replacing same-named
      # assets, and leave its title and notes alone.
      # `dist/` holds the packages plus the sigstore-produced bundles.
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG exists; uploading assets"
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Release $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
        fi
