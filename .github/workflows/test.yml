name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install ruff
      # Pinned so a new ruff release can't turn main red on its own;
      # bump it deliberately alongside any rule changes.
      run: python -m pip install "ruff==0.17.3"
    - name: ruff check
      run: ruff check --output-format=github .
    - name: ruff format --check
      run: ruff format --check .
    - name: Release notes extraction test
      run: .github/scripts/test-extract-release-notes.sh CHANGELOG.md "$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)"

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
    - name: Run offline test suite
      # The default pytest config excludes the AWS-backed AI quality tier
      # (-m "not aws"), so this run is free, offline, and deterministic.
      run: pytest --cov=content_accessibility_utility_on_aws --cov-report=term-missing

  test-extras:
    name: pytest with [i18n,rendered] extras (Python 3.12)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install package with i18n and rendered extras
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,i18n,rendered]"
    - name: Install Chromium for Playwright
      run: python -m playwright install --with-deps chromium
    - name: Run offline suite including the rendered (browser) tier
      # Override the default addopts marker filter so the rendered tier runs;
      # the AWS-backed tier stays excluded (no credentials in CI).
      run: pytest -m "not aws" --cov=content_accessibility_utility_on_aws --cov-report=term-missing
